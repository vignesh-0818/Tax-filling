<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Emerald Gradient -->
    <linearGradient id="tc-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="45%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>

    <!-- OLED Screen Gradient -->
    <linearGradient id="tc-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Amber Equal Key Gradient -->
    <linearGradient id="tc-equal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="tc-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#032110" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Calculator Body -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="14" fill="url(#tc-emerald)" stroke="#4ade80" stroke-width="1.2" stroke-opacity="0.45" />

  <!-- OLED Display Screen -->
  <rect x="7.5" y="7.5" width="49" height="14.5" rx="3.8" fill="url(#tc-screen)" stroke="#1e293b" stroke-width="0.8" />
  
  <!-- Screen Elements -->
  <!-- Status Cyan Dot -->
  <circle cx="11.5" cy="14.75" r="1.5" fill="#38bdf8" />
  <!-- Mini readout indicator -->
  <rect x="24" y="13.25" width="4" height="3" rx="1" fill="#4ade80" />
  <!-- Main Glowing Emerald Digital Segment -->
  <rect x="30" y="11.5" width="22" height="6.5" rx="2" fill="#22c55e" />

  <!-- Keypad Group -->
  <g filter="url(#tc-glow)">
    <!-- Row 1: Function keys -->
    <rect x="7.5" y="26.5" width="14" height="8" rx="2.5" fill="#f1f5f9" />
    <rect x="25" y="26.5" width="14" height="8" rx="2.5" fill="#f1f5f9" />
    <rect x="42.5" y="26.5" width="14" height="8" rx="2.5" fill="#fed7aa" />

    <!-- Row 2: Standard number keys -->
    <rect x="7.5" y="37.5" width="14" height="8" rx="2.5" fill="#ffffff" />
    <rect x="25" y="37.5" width="14" height="8" rx="2.5" fill="#ffffff" />
    <rect x="42.5" y="37.5" width="14" height="8" rx="2.5" fill="#e2e8f0" />

    <!-- Row 3: Standard keys + Amber '=' key -->
    <rect x="7.5" y="48.5" width="14" height="8" rx="2.5" fill="#ffffff" />
    <rect x="25" y="48.5" width="14" height="8" rx="2.5" fill="#ffffff" />
    
    <!-- '=' Button -->
    <rect x="42.5" y="48.5" width="14" height="8" rx="2.5" fill="url(#tc-equal)" />
    <!-- '=' Sign -->
    <rect x="46.5" y="50.8" width="6" height="1.3" rx="0.65" fill="#ffffff" />
    <rect x="46.5" y="53.7" width="6" height="1.3" rx="0.65" fill="#ffffff" />
  </g>
</svg>