<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Emerald Gradient (TaxCore Signature) -->
    <linearGradient id="tc-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="45%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Specular Top Highlight -->
    <linearGradient id="tc-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- OLED Display Gradient -->
    <linearGradient id="tc-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Amber Equal Key Gradient -->
    <linearGradient id="tc-equal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Keypad Drop Shadow -->
    <filter id="tc-key-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="0.8" flood-color="#022c22" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Calculator Body -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="15" fill="url(#tc-emerald)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.55" />
  <rect x="3.8" y="3.8" width="56.4" height="56.4" rx="13.8" fill="none" stroke="url(#tc-shine)" stroke-width="1.1" />

  <!-- OLED Display Screen (Financial Ledger & Real-Time Readout) -->
  <rect x="8" y="7.5" width="48" height="14" rx="3.8" fill="url(#tc-screen)" stroke="#1e293b" stroke-width="0.8" />
  
  <!-- Screen Elements -->
  <!-- Status Cyan Dot (Verified / Live Tax Filing) -->
  <circle cx="12.5" cy="14.5" r="1.6" fill="#38bdf8" />
  
  <!-- Metric Ticker Bar -->
  <rect x="17.5" y="13.25" width="6" height="2.5" rx="1" fill="#475569" />
  
  <!-- Financial Ledger Readout Bar (Emerald) -->
  <rect x="26" y="12" width="13" height="5" rx="1.6" fill="#34d399" />
  
  <!-- Decimal Point -->
  <circle cx="41.5" cy="15.2" r="1.2" fill="#4ade80" />
  
  <!-- Trailing Total Readout -->
  <rect x="44.5" y="12.75" width="7.5" height="3.5" rx="1.2" fill="#22c55e" />

  <!-- Keypad Group (Tax, Billing & Accounting Pillars) -->
  <g filter="url(#tc-key-shadow)">
    <!-- Row 1, Key 1: Addition '+' (Tax Filing & Billing Invoices) -->
    <rect x="8" y="25" width="13.5" height="14" rx="3.5" fill="#ffffff" />
    <path d="M14.75 28.5v7 M11.25 32h7" stroke="#059669" stroke-width="2.2" stroke-linecap="round" />

    <!-- Row 1, Key 2: Subtraction '−' (Deductions & Expenses) -->
    <rect x="25.25" y="25" width="13.5" height="14" rx="3.5" fill="#ffffff" />
    <path d="M28.5 32h7" stroke="#059669" stroke-width="2.2" stroke-linecap="round" />

    <!-- Row 1, Key 3: Percentage '%' (Tax Rates & Compliance) -->
    <rect x="42.5" y="25" width="13.5" height="14" rx="3.5" fill="#ffffff" />
    <circle cx="46.5" cy="29.2" r="1.4" fill="#059669" />
    <path d="M51.2 28.5l-4.5 7" stroke="#059669" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="51.8" cy="34.8" r="1.4" fill="#059669" />

    <!-- Row 2, Key 4: Ledger Document Lines (Bookkeeping & Accounting) -->
    <rect x="8" y="42.5" width="13.5" height="14" rx="3.5" fill="#ffffff" />
    <path d="M11.5 46.5h6.5 M11.5 49.5h6.5 M11.5 52.5h4.2" stroke="#059669" stroke-width="1.8" stroke-linecap="round" />

    <!-- Row 2, Key 5: Financial Growth Bars (Advisory & Virtual CFO) -->
    <rect x="25.25" y="42.5" width="13.5" height="14" rx="3.5" fill="#ffffff" />
    <rect x="27.8" y="49.5" width="2.2" height="4" rx="0.6" fill="#059669" />
    <rect x="31" y="46.5" width="2.2" height="7" rx="0.6" fill="#059669" />
    <rect x="34.2" y="44" width="2.2" height="9.5" rx="0.6" fill="#059669" />

    <!-- Row 2, Key 6: Equal '=' Key (Reconciliation & Bottom Line) -->
    <rect x="42.5" y="42.5" width="13.5" height="14" rx="3.5" fill="url(#tc-equal)" />
    <rect x="45.5" y="47" width="7.5" height="1.8" rx="0.9" fill="#ffffff" />
    <rect x="45.5" y="50.4" width="7.5" height="1.8" rx="0.9" fill="#ffffff" />
  </g>
</svg>